<!--
    Nature Canvas - Computer Science Portfolio

    Sections:
    - Home: name, role, short bio
    - Social & professional links
    - Technical skills, grouped by category
    - Experience
    - Projects
    - Education

    All content is loaded at runtime from assets/user_data/*.json by js/index.js,
    so this file only defines structure. Colours live in Nature_Canvas/css.

    Asset paths are relative (no leading slash) so the site works both at a
    domain root and under a subpath like /portfolio/ on GitHub Pages.
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Portfolio</title>

    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Nature-inspired computer science portfolio showcasing software projects, technical skills, experience, and education." />
    <meta name="keywords"
        content="computer science portfolio, software engineer, developer portfolio, projects, skills, education" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/title-icon.png" />
    <link rel="apple-touch-icon" href="assets/images/title-icon.png" />

    <!-- Open Graph / Facebook Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Computer Science Portfolio" />
    <meta property="og:description"
        content="Nature-inspired computer science portfolio showcasing software projects, technical skills, experience, and education." />
    <meta property="og:image" content="Nature_Canvas/site-previews/website_1.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card Preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Computer Science Portfolio" />
    <meta name="twitter:description"
        content="Nature-inspired computer science portfolio showcasing software projects, technical skills, experience, and education." />
    <meta name="twitter:image" content="Nature_Canvas/site-previews/website_1.png" />

    <!-- Theme Color for mobile browsers (deep pine from the palette) -->
    <meta name="theme-color" content="#1A3637" />

    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
            default-src 'self';
            img-src 'self' data: https:;
            style-src 'self' 'unsafe-inline' https:;
            script-src 'self' 'unsafe-inline';
            font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;">

    <!-- Nature Canvas theme styles -->
    <link rel="stylesheet" href="Nature_Canvas/css/variables.css" />
    <link rel="stylesheet" href="Nature_Canvas/css/main-styles.css" />
    <link rel="stylesheet" href="Nature_Canvas/css/index.css" />
    <link rel="stylesheet" href="Nature_Canvas/css/index-dark.css" />
    <link rel="stylesheet" href="Nature_Canvas/css/responsive-styles.css" />

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Marcellus:wght@400;600&family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body data-baseurl="">
    <header>
        <nav>
            <ul>
                <li><a href="#home" class="nav-link"><i class="fas fa-house"></i> Home</a></li>
                <li><a href="#skills" class="nav-link"><i class="fas fa-lightbulb"></i> Skills</a></li>
                <li><a href="#experience" class="nav-link"><i class="fas fa-briefcase"></i> Experience</a></li>
                <li><a href="#projects" class="nav-link"><i class="fas fa-code"></i> Projects</a></li>
                <li><a href="#education" class="nav-link"><i class="fas fa-graduation-cap"></i> Education</a></li>
                <li><a href="#mode" class="nav-link"><i class="fas fa-moon"></i> Dark Mode</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Home Section with user basic info -->
        <section id="home" class="section home-section">
            <h1 id="name" class="name"></h1>
            <p id="role" class="role"></p>
            <p id="bio" class="bio"></p>
        </section>

        <!-- Social links with icons -->
        <section id="social" class="section social-section">
            <h2 class="section-heading">Social Links</h2>
            <div id="social-links" class="social-links"></div>
        </section>

        <!-- Technical skills, grouped by category -->
        <section id="skills" class="section skills-section">
            <h2 class="section-heading">Technical Skills</h2>
            <div id="skills-groups" class="skills-groups"></div>
        </section>

        <!-- Work and research experience -->
        <section id="experience" class="section experience-section">
            <h2 class="section-heading">Experience</h2>
            <div id="experience-list" class="experience-list"></div>
        </section>

        <!-- Projects showcase -->
        <section id="projects" class="section projects-section">
            <h2 class="section-heading">Projects</h2>
            <div id="projects-list" class="projects-list section-list"></div>
        </section>

        <!-- Education background -->
        <section id="education" class="section education-section">
            <h2 class="section-heading">Education</h2>
            <div id="education-table" class="education-table section-list"></div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; <span id="footer-year"></span> <span id="footer-name">@name</span>. All rights reserved.</p>
    </footer>

    <!-- Loads all content from assets/user_data -->
    <script src="js/index.js"></script>
</body>

</html>
