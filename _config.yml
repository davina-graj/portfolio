# The base URL of your site, used in constructing absolute URLs for assets like images and pages
url: "https://davina-graj.github.io"

# The subdirectory of your GitHub Pages site (if the repository is not user.github.io)
# For a repo at github.com/davina-graj/portfolio this is "/portfolio".
# Leave it as "" when serving from a custom domain or a user site.
baseurl: "/portfolio"

# Working folders that should never be built or published
exclude:
  - deleteLater
  - preview-shots
  - dev-server.py
