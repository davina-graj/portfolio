<!--
    🌿 Nature Canvas – Computer Science Portfolio (theme page)

    Identical in structure to the site root page; kept here so the
    Nature Canvas theme stays self-contained and previewable at
    /Nature_Canvas. Content comes from assets/user_data/*.json via
    js/index.js, colours from the css folder beside this file.
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Nature Canvas 🌱 Portfolio</title>

    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Nature-inspired computer science portfolio showcasing software projects, technical skills, education, and certifications." />
    <meta name="keywords"
        content="computer science portfolio, software engineer, developer portfolio, projects, skills, education" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ site.baseurl }}/assets/images/title-icon.png" />
    <link rel="apple-touch-icon" href="{{ site.baseurl }}/assets/images/title-icon.png" />

    <!-- Open Graph / Facebook Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nature Canvas Computer Science Portfolio" />
    <meta property="og:description"
        content="Nature-inspired computer science portfolio showcasing software projects, technical skills, education, and certifications." />
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/Nature_Canvas/site-previews/website_1.png" />
    <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}/Nature_Canvas" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card Preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nature Canvas Computer Science Portfolio" />
    <meta name="twitter:description"
        content="Nature-inspired computer science portfolio showcasing software projects, technical skills, education, and certifications." />
    <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/Nature_Canvas/site-previews/website_1.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}/Nature_Canvas" />

    <!-- Theme Color for mobile browsers (deep pine from the palette) -->
    <meta name="theme-color" content="#1A3637" />

    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
            default-src 'self';
            img-src 'self' data: https:;
            style-src 'self' 'unsafe-inline' https:;
            script-src 'self' 'unsafe-inline';
            font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;">

    <!-- Nature Canvas theme styles -->
    <link rel="stylesheet" href="{{ site.baseurl }}/Nature_Canvas/css/variables.css" />
    <link rel="stylesheet" href="{{ site.baseurl }}/Nature_Canvas/css/main-styles.css" />
    <link rel="stylesheet" href="{{ site.baseurl }}/Nature_Canvas/css/index.css" />
    <link rel="stylesheet" href="{{ site.baseurl }}/Nature_Canvas/css/index-dark.css" />
    <link rel="stylesheet" href="{{ site.baseurl }}/Nature_Canvas/css/responsive-styles.css" />

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Marcellus:wght@400;600&family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body data-baseurl="{{ site.baseurl }}">
    <header>
        <nav>
            <ul>
                <li><a href="{{ site.baseurl }}/" class="nav-link" target="_parent"><i class="fas fa-house"></i>
                        Home</a></li>
                <li><a href="#projects" class="nav-link"><i class="fas fa-code"></i> Projects</a></li>
                <li><a href="#skills" class="nav-link"><i class="fas fa-lightbulb"></i> Skills</a></li>
                <li><a href="#social" class="nav-link"><i class="fas fa-share-alt"></i> Socials</a></li>
                <li><a href="#education" class="nav-link"><i class="fas fa-graduation-cap"></i> Education</a></li>
                <li><a href="#mode" class="nav-link"><i class="fas fa-moon"></i> Dark Mode</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Home Section with user basic info -->
        <section id="home" class="section home-section">
            <h1 id="name" class="name"></h1>
            <p id="role" class="role"></p>
            <p id="bio" class="bio"></p>
        </section>

        <!-- Social links with icons -->
        <section id="social" class="section social-section">
            <h2 class="section-heading">Social Links</h2>
            <div id="social-links" class="social-links"></div>
        </section>

        <!-- Technical skills -->
        <section id="skills" class="section skills-section">
            <h2 class="section-heading">Technical Skills</h2>
            <ul id="skills-list" class="skills-list"></ul>
        </section>

        <!-- Projects showcase -->
        <section id="projects" class="section projects-section">
            <h2 class="section-heading">Projects</h2>
            <div id="projects-list" class="projects-list section-list"></div>
        </section>

        <!-- Certifications display -->
        <section id="certifications" class="section certifications-section">
            <h2 class="section-heading">Certifications</h2>
            <div id="certifications-list" class="certifications-list section-list"></div>
        </section>

        <!-- Education background -->
        <section id="education" class="section education-section">
            <h2 class="section-heading">Education</h2>
            <div id="education-table" class="education-table section-list"></div>
        </section>

        <!-- Research papers and technical writing -->
        <section id="research" class="section research-section">
            <h2 class="section-heading">Research &amp; Writing</h2>
            <div id="research-papers" class="research-list section-list"></div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; <span id="footer-year"></span> <span id="footer-name">@name</span>. All rights reserved.</p>
    </footer>

    <!-- Loads all content from assets/user_data -->
    <script src="{{ site.baseurl }}/js/index.js"></script>
</body>

</html>
